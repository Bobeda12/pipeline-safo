name: Atualização Diária da Base de Dados

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# --- MUDANÇA PRINCIPAL: Adiciona permissões de escrita ---
permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Executar script de atualização
        run: python run_update.py

      - name: Commit e Push da base de dados atualizada
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática da base de dados"
          file_pattern: "*.db"

    

