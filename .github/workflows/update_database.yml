name: Atualização Diária da Base de Dados

on:
  # Aciona a workflow todos os dias às 3:00 da manhã (horário UTC)
  schedule:
    - cron: '0 3 * * *'
  # Permite que você acione a workflow manualmente a partir do site do GitHub
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do seu código do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v3

      # 2. Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Instala todas as dependências do projeto
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Executa o nosso script de atualização
      - name: Executar script de atualização (Crawler e IA)
        run: python run_update.py

      # 5. Faz o commit e push do ficheiro .db atualizado de volta para o repositório
      - name: Commit e Push da base de dados atualizada
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Atualização automática da base de dados" || echo "Nenhuma alteração para commitar"
          git push
```

---

#### Passo 3: Finalizar e Enviar

1.  **Envie todas estas alterações para o GitHub:**
    ```bash
    git add .
    git commit -m "Adiciona workflow de atualização automática com GitHub Actions"
    git push
    
