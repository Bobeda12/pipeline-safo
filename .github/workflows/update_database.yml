name: Atualização Diária da Base de Dados

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # --- MUDANÇA PRINCIPAL: Garante que as quebras de linha estão corretas ---
          crlf: 'true'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências (com passo separado para Torch)
        run: |
          python -m pip install --upgrade pip
          # 1. Instala o torch e suas dependências primeiro, usando o link especial
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # 2. Instala o resto das bibliotecas do requirements.txt
          pip install -r requirements.txt
      
      - name: Executar script de atualização
        run: python run_update.py

      - name: Commit e Push da base de dados atualizada
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática da base de dados"
          file_pattern: "*.db"