name: Atualização Diária da Base de Dados

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      
      # --- MUDANÇA PRINCIPAL: Adiciona as variáveis de ambiente a partir dos Secrets ---
      - name: Executar script de atualização
        env:
          DB_TYPE: ${{ secrets.DB_TYPE }}
          DB_NAME: ${{ secrets.DB_NAME }}
          COLUNA_EDITAL_STATUS: ${{ secrets.COLUNA_EDITAL_STATUS }}
          COLUNA_EDITAL_ELEGIBILIDADE: ${{ secrets.COLUNA_EDITAL_ELEGIBILIDADE }}
        run: python run_update.py

      - name: Commit e Push da base de dados atualizada
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática da base de dados"
          file_pattern: "*.db"