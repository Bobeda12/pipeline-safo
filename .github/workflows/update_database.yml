name: Atualização Diária da Base de Dados (PostgreSQL)

on:
  schedule:
    - cron: '0 3 * * *' # Mantém agendamento para 3 AM UTC
  workflow_dispatch: # Permite acionamento manual

permissions:
  contents: read # Permissão de leitura é suficiente agora

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Use a versão Python compatível
          cache: 'pip'

      - name: Instalar dependências (incluindo PyTorch CPU e psycopg2)
        run: |
          python -m pip install --upgrade pip
          # 1. Instala PyTorch CPU
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # 2. Instala o resto das dependências do requirements.txt (incluirá psycopg2)
          pip install -r requirements.txt

      - name: Executar script de atualização (conectando ao Supabase)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # Usa o secret configurado no GitHub
        run: python run_update.py # Este script agora atualiza o Supabase diretamente

      # REMOVIDO: Passos de commit/push do arquivo SQLite
      # - name: Commit e Push da base de dados atualizada
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: "Atualização automática da base de dados"
      #     file_pattern: "*.db" # Não mais necessário

      # OPCIONAL: Acionar Deploy Hook do Render
      # Descomente se precisar reiniciar a aplicação web após a atualização dos dados
