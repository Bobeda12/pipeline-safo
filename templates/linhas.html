{% extends "base.html" %}
{% block title %}Gerenciar Linhas de Pesquisa{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Linhas de Pesquisa Cadastradas</h2>
    <a href="{{ url_for('adicionar_linha') }}" class="btn btn-success">Adicionar Nova Linha</a>
</div>
<table class="table table-striped">
    <thead class="table-dark">
        <tr>
            <th>Programa</th>
            <th>Linha de Pesquisa</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for linha in linhas %}
        <tr>
            <td>{{ linha.programa }}</td>
            <td>{{ linha.linha }}</td>
            <td>
                <a href="{{ url_for('editar_linha', linha_id=linha.id) }}" class="btn btn-sm btn-primary">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
