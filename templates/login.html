{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header text-center h4">
                Acesso ao Sistema Sinapse
            </div>
            <div class="card-body p-4">
                <form method="post" action="{{ url_for('login') }}">
                    <input type="hidden" name="next" value="{{ next or request.args.get('next', '') }}">
                    
                    <div class="mb-3">
                        <label for="inputEmailLogin" class="form-label">E-mail Institucional</label>
                        <input type="email" class="form-control" id="inputEmailLogin" name="email" value="{{ email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputPasswordLogin" class="form-label">Senha</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="inputPasswordLogin" name="password" required>
                            <span class="input-group-text toggle-password" id="togglePasswordLogin" onclick="togglePasswordVisibility('inputPasswordLogin', 'togglePasswordLogin')">
                                <i class="bi bi-eye-slash"></i>
                            </span>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-1">Não tem uma conta? <a href="{{ url_for('register') }}">Crie uma aqui.</a></p>
                    <a href="{{ url_for('home') }}">Continuar sem login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
