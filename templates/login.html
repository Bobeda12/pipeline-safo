{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-5 col-md-7">
        
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Acesso ao Sistema Sinapse</h4>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail Institucional</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ request.form.email or '' }}" required>
                    </div>

                    <!-- *** CORREÇÃO PROBLEMA 1: Campo de senha com ícone *** -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Senha</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" value="{{ request.form.password or '' }}" required>
                            <span class="input-group-text" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')" style="cursor: pointer;">
                                <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                            </span>
                        </div>
                    </div>
                    <!-- *** FIM DA CORREÇÃO *** -->

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>
                     <div class="text-center mb-3">
                        <a href="{{ url_for('home') }}" class="text-muted small">Continuar sem login</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <small>Não tem uma conta? <a href="{{ url_for('register') }}" class="alert-link">Crie uma aqui</a>.</small>
            </div>
        </div>

    </div>
</div>
{% endblock %}
